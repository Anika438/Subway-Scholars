<!DOCTYPE html>
<html>

<head>
    <title>DISTRACTION BLOCKED</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111827;
            /* Dark slate */
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: repeating-linear-gradient(0deg, #171e2e, #171e2e 30px, #131926 30px, #131926 60px);
        }

        .header {
            background-color: #0f172a;
            padding: 30px 0;
            width: 100%;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Impact', sans-serif;
            color: #FF9800;
            /* Primary orange */
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.2rem;
            color: #FF9800;
            margin: 10px 0 20px 0;
        }

        #question-text {
            font-size: 1.5rem;
            max-width: 700px;
            margin: 0 auto 30px auto;
            line-height: 1.4;
            padding: 0 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-option {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 80%;
            max-width: 500px;
            transition: all 0.2s;
        }

        .btn-option:hover {
            background-color: #FF9800;
            color: #000;
        }

        #feedback {
            margin-top: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 20px;
        }

        .error {
            color: #ff3b3b;
        }

        .success {
            color: #00E676;
        }

        #loading {
            color: #00D4FF;
            font-size: 1.5rem;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>FOCUS PENALTY</h1>
        </div>

        <div id="loading">Generating quiz questions...</div>

        <div id="quiz-ui" style="display: none;">
            <h2 id="progress-text">Question 1 of 3</h2>
            <div id="question-text">Loading question...</div>
            <div class="options-container" id="options-container">
                <!-- Buttons injected via JS -->
            </div>
            <div id="feedback"></div>
        </div>
    </div>

    <script src="blocked.js"></script>
</body>

</html>
